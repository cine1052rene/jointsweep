[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jointsweep"
version = "0.1.0"
description = "Find robot-description defects by measuring them: self-collision inside joint limits, actuator ranges past joint ranges, and drift from the source model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.1", "numpy>=1.24"]

[project.optional-dependencies]
exact = ["trimesh>=4.0", "manifold3d>=2.4"]
dev = ["pytest>=8"]

[project.scripts]
jointsweep = "jointsweep.cli:main"

[tool.setuptools.packages.find]
include = ["jointsweep*"]
